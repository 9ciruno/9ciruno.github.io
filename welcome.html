<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎来到我的网页</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* 飘浮的粒子 */
  .particle {
    position: absolute;
    bottom: -60px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0;
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.6;
    }
    100% {
      transform: translateY(-110vh) scale(0.4);
      opacity: 0;
    }
  }

  .welcome {
    text-align: center;
    position: relative;
    z-index: 1;
    padding: 0 20px;
  }

  .welcome h1 {
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    color: #fff;
    letter-spacing: 0.15em;
    text-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    animation: popIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .welcome h1 span {
    display: inline-block;
    animation: bounce 2.5s ease infinite;
  }

  /* 每个字依次弹跳 */
  .welcome h1 span:nth-child(1) { animation-delay: 0.0s; }
  .welcome h1 span:nth-child(2) { animation-delay: 0.1s; }
  .welcome h1 span:nth-child(3) { animation-delay: 0.2s; }
  .welcome h1 span:nth-child(4) { animation-delay: 0.3s; }
  .welcome h1 span:nth-child(5) { animation-delay: 0.4s; }
  .welcome h1 span:nth-child(6) { animation-delay: 0.5s; }
  .welcome h1 span:nth-child(7) { animation-delay: 0.6s; }
  .welcome h1 span:nth-child(8) { animation-delay: 0.7s; }

  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-25px); }
    60% { transform: translateY(-12px); }
  }

  @keyframes popIn {
    from {
      opacity: 0;
      transform: scale(0.6);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  .welcome p {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: rgba(255, 255, 255, 0.9);
    letter-spacing: 0.3em;
    animation: fadeIn 2s ease 0.8s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* 文字上的一圈光晕 */
  .glow {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 40vmin;
    height: 40vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.25) 0%, transparent 70%);
    animation: pulse 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1);   opacity: 0.6; }
    50%      { transform: translate(-50%, -50%) scale(1.3); opacity: 1;   }
  }
</style>
</head>
<body>

  <!-- 背景粒子由 JS 生成 -->
  <div class="glow"></div>

  <div class="welcome">
    <h1>
      <span>欢</span><span>迎</span><span>来</span><span>到</span><span>我</span><span>的</span><span>网</span><span>页</span>
    </h1>
    <p>WELCOME TO MY WEBSITE</p>
  </div>

<script>
  // 生成飘浮粒子
  const colors = ['#ffffff', '#ffe6a7', '#b8f2e6', '#ffd6e0'];
  const particleCount = 30;

  for (let i = 0; i < particleCount; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 14 + 6;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = Math.random() * 8 + 6 + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    document.body.appendChild(p);
  }
</script>

</body>
</html>
